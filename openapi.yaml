openapi: 3.1.0
info:
  title: Sportmonks Cricket Oracle API
  version: 1.1.0
  summary: Signed cricket fixture and status data for verifiable apps.
  description: |
    Mina/o1js signed cricket-data oracle. Sportmonks Cricket v2 is normalized
    to integers and Schnorr-signed. This is not a predictor or odds API.

    Breaking v1.1 changes: status codes 1–6 with no cancelled default, and a
    signed `outcome` field. Status field order is
    `[fixtureID, localTeamID, visitorTeamID, startingAt, status, winnerTeamID, outcome]`.

    `/` is a human verification console. `/docs` describes the contract.
    `/spec` is an OpenAPI explorer pointed at `/openapi.yaml`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://sportmonksoracle.vercel.app
    description: Public demo oracle
  - url: http://localhost:3000
    description: Local development
paths:
  /fixture:
    get:
      summary: Get upcoming fixtures
      description: |
        Returns one signed fixture by default, or a signed list when more than
        one fixture matches. `limit=1` with a single match is an object plus
        `signature`. `limit=2` with two matches is `data` and `signatures` arrays.
        Team names are unsigned display fields.
      parameters:
        - name: leagueId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 3
          description: Sportmonks league ID. Default 3 is T20I.
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: NS
          description: Sportmonks fixture status filter, not the oracle 1–6 code.
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: >
            Filter using Sportmonks `filter[localteam_id]` and
            `filter[visitorteam_id]`, then merge. Pagination continues until
            `limit` is met or pages exhaust.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
          description: Number of fixtures to return.
      responses:
        "200":
          description: Signed fixture payload.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Short public cache header. Default 60 seconds.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SignedFixtureResponse"
                  - $ref: "#/components/schemas/SignedFixtureListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SportmonksAuthError"
        "403":
          $ref: "#/components/responses/SportmonksAuthError"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/SportmonksError"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
        "500":
          $ref: "#/components/responses/ServerError"
  /status/{fixtureID}:
    get:
      summary: Get fixture status
      description: |
        Returns the signed status vector. Unsigned team names may be present
        when Sportmonks includes them. `timestamp` is unsigned. A valid
        signature means this oracle attested these fields once, not that the
        match is live.
      parameters:
        - name: fixtureID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Sportmonks fixture ID.
      responses:
        "200":
          description: Signed fixture status payload.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Short public cache header. Default 15 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SportmonksAuthError"
        "403":
          $ref: "#/components/responses/SportmonksAuthError"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/SportmonksError"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  schemas:
    FixtureData:
      type: object
      required:
        - fixtureID
        - localTeamID
        - visitorTeamID
        - startingAt
        - timestamp
      properties:
        fixtureID:
          type: integer
        localTeamID:
          type: integer
        visitorTeamID:
          type: integer
        startingAt:
          type: integer
          description: Unix timestamp in milliseconds, parsed as UTC.
        localTeamName:
          type: string
          description: Unsigned display name.
        localTeamCode:
          type: string
          description: Unsigned display code.
        visitorTeamName:
          type: string
          description: Unsigned display name.
        visitorTeamCode:
          type: string
          description: Unsigned display code.
        timestamp:
          type: integer
          description: Unsigned time the oracle built the response.
    StatusData:
      allOf:
        - $ref: "#/components/schemas/FixtureData"
        - type: object
          required:
            - status
            - winnerTeamID
            - outcome
          properties:
            status:
              type: integer
              enum: [1, 2, 3, 4, 5, 6]
              description: >
                1 not started, 2 in progress, 3 finished, 4 cancelled,
                5 postponed, 6 abandoned.
            winnerTeamID:
              type: integer
              description: Sportmonks winner team ID, or 0 when no team id is present.
            outcome:
              type: integer
              enum: [0, 1, 2, 3]
              description: >
                0 none/unknown, 1 winner, 2 draw, 3 no-result. 0 is not
                “ongoing only”.
    SignedFixtureResponse:
      type: object
      required: [data, signature, publicKey]
      properties:
        data:
          $ref: "#/components/schemas/FixtureData"
        signature:
          type: string
        publicKey:
          type: string
    SignedFixtureListResponse:
      type: object
      required: [data, signatures, publicKey]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FixtureData"
        signatures:
          type: array
          items:
            type: string
        publicKey:
          type: string
    SignedStatusResponse:
      type: object
      required: [data, signature, publicKey]
      properties:
        data:
          $ref: "#/components/schemas/StatusData"
        signature:
          type: string
        publicKey:
          type: string
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - BAD_REQUEST
            - CONFIG_ERROR
            - NOT_FOUND
            - SIGNING_ERROR
            - SPORTMONKS_AUTH_ERROR
            - SPORTMONKS_ERROR
            - SPORTMONKS_RATE_LIMIT
            - UNKNOWN_STATUS
            - MALFORMED_UPSTREAM
            - UPSTREAM_TIMEOUT
            - RATE_LIMITED
            - INTERNAL_ERROR
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SportmonksAuthError:
      description: Sportmonks rejected or blocked the API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No matching fixture or status was found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Caller or Sportmonks rate limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SportmonksError:
      description: Sportmonks failed, returned an unknown status, or sent malformed data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamTimeout:
      description: Sportmonks timed out.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Oracle config, signing, or internal failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
